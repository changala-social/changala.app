name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      # src/generated/ is checked in — no atrg generate step needed.
      # If lexicons change, run `atrg generate` locally and commit the result.

      - name: Check formatting
        run: nix develop --command cargo fmt --check

      - name: Clippy
        run: nix develop --command cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: nix develop --command cargo test

      - name: Build
        run: nix develop --command cargo build

      - name: E2E tests
        run: |
          chmod +x tests/e2e/run.sh
          nix develop --command bash tests/e2e/run.sh
