name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # ── Build image + binary per arch ──────────────────────────
  build:
    name: Build — ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image (nix)
        run: nix build .#docker-image --print-build-logs

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and push platform image
        run: |
          docker load < result
          REPO="ghcr.io/${{ github.repository }}"
          TAG="${{ steps.tag.outputs.tag }}"
          docker tag "$REPO:latest" "$REPO:$TAG-${{ matrix.arch }}"
          docker push "$REPO:$TAG-${{ matrix.arch }}"

      - name: Extract binaries for release
        run: |
          mkdir -p dist
          # Both binaries are in the same workspace build output
          WS_PATH=$(nix build .#changala-ring --no-link --print-out-paths)
          cp "$WS_PATH/bin/changala-ring" dist/changala-ring-linux-${{ matrix.arch }}
          cp "$WS_PATH/bin/changala-aggregator" dist/changala-aggregator-linux-${{ matrix.arch }}
          chmod +x dist/*

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: changala-linux-${{ matrix.arch }}
          path: dist/

  # ── Multi-arch manifest ────────────────────────────────────
  manifest:
    name: Multi-arch Manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          REPO="ghcr.io/${{ github.repository }}"
          TAG="${{ steps.tag.outputs.tag }}"
          docker buildx imagetools create \
            -t "$REPO:$TAG" \
            -t "$REPO:latest" \
            "$REPO:$TAG-amd64" \
            "$REPO:$TAG-arm64"

  # ── GitHub Release ─────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [build, manifest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: changala-linux-*
          path: artifacts

      - name: Generate checksums
        run: |
          cd artifacts
          find . -type f -name 'changala-*' -exec sh -c '
            for f; do sha256sum "$f"; done
          ' _ {} + | tee ../SHA256SUMS

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/**/*
            SHA256SUMS
