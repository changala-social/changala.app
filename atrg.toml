[app]
name = "changala"
host = "127.0.0.1"
port = 3000
secret_key = "5d35c20908906d926e1804c21a664dc744e8a25f49fd3121f10dc3baad462e2c"
cors_origins = ["http://localhost:5173"]
environment = "development"
admin_dids = []

[auth]
# Defaults for local dev. Override via env vars in production:
#   ATRG_AUTH__CLIENT_ID
#   ATRG_AUTH__REDIRECT_URI
#   ATRG_AUTH__POST_LOGIN_REDIRECT  (requires atrg-core >=0.1.4, use atrg.toml for now)
client_id = "http://localhost:3000/client-metadata.json"
redirect_uri = "http://localhost:3000/auth/callback"
post_login_redirect = "http://localhost:5173/login"
scope = "atproto transition:generic"

[database]
url = "postgres://changala@127.0.0.1:5432/changala"

[jetstream]
host = "jetstream1.us-east.bsky.network"
collections = [
    "app.changala.membership",
    "app.changala.keyword",
    "app.changala.note",
    "app.changala.vote",
    "app.changala.collectivenote.proposal",
    "app.changala.label",
    "app.changala.brain.node",
    "app.changala.brain.link",
]
cursor = "auto"

[changala]
database_url = "postgres://changala@127.0.0.1:5432/changala"

[changala.s3]
endpoint = "http://127.0.0.1:9000"
bucket = "changala-blobs"
region = "us-east-1"
access_key = ""
secret_key = ""
path_style = true
