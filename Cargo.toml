[package]
name = "changala"
version = "0.1.13"
edition = "2021"
description = "Federated social learning platform and student knowledge graph on AT Protocol"

[dependencies]
# AT Protocol framework — postgres backend
atrg-core = { version = "0.1.3", default-features = false, features = ["postgres"] }
atrg-auth = { version = "0.1.3", default-features = false, features = ["postgres"] }
atrg-db = { version = "0.1.3", default-features = false, features = ["postgres"] }
atrg-xrpc = "0.1.3"
atrg-stream = "0.1.3"
atrg-repo = "0.1.3"
atrg-identity = "0.1.3"

# HTTP
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database — Postgres only
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "migrate"] }

# Blob storage (S3-compatible — RustFS, MinIO, AWS S3)
rust-s3 = "0.35"
sha2 = "0.10"
hex = "0.4"

# Utilities
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"

[dev-dependencies]
atrg-testing = "0.1.3"
