[package]
name = "changala"
version = "0.1.0"
edition = "2021"
description = "Federated social learning platform and student knowledge graph on AT Protocol"

[dependencies]
atrg-core = "0.1"
atrg-auth = "0.1"
atrg-db = "0.1"
atrg-xrpc = "0.1"
atrg-stream = "0.1"
atrg-repo = "0.1"
atrg-identity = "0.1"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
atrg-testing = "0.1"
