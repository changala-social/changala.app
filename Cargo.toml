[workspace]
resolver = "2"
members = [
    "crates/changala-shared",
    "crates/changala-ring",
    "crates/changala-aggregator",
    "crates/changala-mcp",
]

[workspace.package]
version = "0.3.9"
edition = "2021"

[workspace.dependencies]
# AT Protocol framework
atrg-core = { version = "0.2.0", default-features = false, features = ["postgres"] }
atrg-auth = { version = "0.2.0", default-features = false, features = ["postgres"] }
atrg-db = { version = "0.2.0", default-features = false, features = ["postgres"] }
atrg-xrpc = "0.2.0"
atrg-stream = { version = "0.2.0", default-features = false, features = ["postgres"] }
atrg-repo = "0.2.0"
atrg-identity = "0.2.0"
atrg-blob = { version = "0.2.0", features = ["s3"] }
# atrg-email = { version = "0.2.0", ... }  — disabled: upstream bug (non-exhaustive DbPool match in otp.rs)
# keeping custom email.rs until atrg-email 0.2.1 ships the fix
atrg-testing = "0.2.0"

# HTTP
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Database
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio", "migrate"] }

# Blob storage
rust-s3 = "0.35"
sha2 = "0.10"
hex = "0.4"

# Email
lettre = { version = "0.11", features = ["tokio1-native-tls"] }

# Crypto / encoding
rand = "0.8"
base64 = "0.22"

# Utilities
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

urlencoding = "2.1"
schemars = "1.0"
rmcp = { version = "1.6", features = ["server", "transport-streamable-http-server"] }
reqwest = { version = "0.12", features = ["json"] }

# Shared
changala-shared = { path = "crates/changala-shared" }
changala-mcp = { path = "crates/changala-mcp" }
